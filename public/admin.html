<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки — MADDOX</title><link rel="stylesheet" href="style.css"><style>.admin{padding:55px 6vw}.admin-tools{display:flex;gap:10px;margin:25px 0}.admin input{background:#181818;border:1px solid #555;color:white;padding:12px;min-width:260px}.admin table{width:100%;border-collapse:collapse;font-size:12px}.admin th,.admin td{text-align:left;border-bottom:1px solid #444;padding:12px 8px}.admin th{color:#d7ff35}.admin .muted{color:#888;font-size:12px}@media(max-width:700px){.admin{overflow-x:auto}.admin table{min-width:800px}}</style></head><body><header class="header"><a class="brand" href="/"><span class="brand-mark">M</span><span>MADDOX</span></a><a href="/">На сайт ↗</a></header><main class="admin"><p class="eyebrow">MADDOX / PRIVATE AREA</p><h2>ЗАЯВКИ<br><span style="color:#d7ff35">КЛУБА</span></h2><p class="muted">Доступ только для администратора. Токен хранится в текущей вкладке браузера.</p><div class="admin-tools"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button class="btn btn-accent" id="load">Загрузить заявки</button></div><p id="msg" class="muted"></p><div id="table"></div></main><script>
const token=document.getElementById('token'),msg=document.getElementById('msg'),table=document.getElementById('table');
document.getElementById('load').onclick=async()=>{msg.textContent='Загружаем…';table.innerHTML='';try{const r=await fetch('/api/admin/applications',{headers:{Authorization:'Bearer '+token.value}});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');const rows=d.applications||[];msg.textContent='Заявок: '+rows.length;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));table.innerHTML='<table><thead><tr><th>Дата</th><th>ФИО</th><th>Телефон</th><th>E-mail</th><th>Реклама</th><th>Статус</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(new Date(x.createdAt).toLocaleString('ru-RU'))+'</td><td>'+esc(x.fullname)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.email)+'</td><td>'+(x.marketingConsent?'Да':'Нет')+'</td><td><select data-id="'+esc(x.id)+'"><option value="new" '+(x.status==='new'?'selected':'')+'>Новая</option><option value="contacted" '+(x.status==='contacted'?'selected':'')+'>Связались</option><option value="closed" '+(x.status==='closed'?'selected':'')+'>Закрыта</option></select></td></tr>').join('')+'</tbody></table>';table.querySelectorAll('select').forEach(sel=>sel.onchange=async()=>{const rr=await fetch('/api/admin/applications/'+encodeURIComponent(sel.dataset.id),{method:'PATCH',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/json'},body:JSON.stringify({status:sel.value})});if(!rr.ok)alert('Не удалось изменить статус')});}catch(e){msg.textContent=e.message}};
</script></body></html>
